# Scheduled refresh only — `sync` never writes to Wix. It pulls new/changed
# Wix events into Notion, runs the enrich pass, and refreshes Published rows.
# Pushing rows to Wix (Ready/Update/Cancel/Delete) is a deliberate human
# action: run `python sync_events.py push` from a terminal.
name: Sync Events from Wix to Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  # Notion automations/buttons can fire this via a webhook to
  # https://api.github.com/repos/{owner}/{repo}/dispatches with
  # body {"event_type": "notion-sync"}. See docs/NOTION_BACKEND.md.
  repository_dispatch:
    types: [notion-sync]

# Never run two syncs at once: overlapping runs would race their Notion
# writes (pull-created rows and Published refreshes could double up).
# Queue instead of cancel — a mid-flight sync must finish.
concurrency:
  group: wix-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `sync` runs the pull and enrich passes first, so one step covers all
      # three (pull + enrich + Published refresh). It never writes to Wix,
      # which is why this scheduled run deliberately targets PRODUCTION with
      # --production: it only reads the live site and mirrors it into Notion.
      # `push` (the Wix-mutating command) is never run here.
      - name: Pull + enrich + refresh events from Wix into Notion
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_ACCOUNT_ID: ${{ secrets.WIX_ACCOUNT_ID }}
          # Stays on the dev site id; --production below retargets the run
          # onto WIX_PROD_SITE_ID, which must be set in repo secrets.
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_PROD_SITE_ID: ${{ secrets.WIX_PROD_SITE_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          NOTION_EVENT_SCHEDULING_DB_ID: ${{ secrets.NOTION_EVENT_SCHEDULING_DB_ID }}
          NOTION_CATALOG_DB_ID: ${{ secrets.NOTION_CATALOG_DB_ID }}
          # Legacy secret names; remove once the new *_DB_ID secrets are set.
          NOTION_EVENTS_DB_ID: ${{ secrets.NOTION_EVENTS_DB_ID }}
          NOTION_CLASSES_DB_ID: ${{ secrets.NOTION_CLASSES_DB_ID }}
          NOTION_SETTINGS_DB_ID: ${{ secrets.NOTION_SETTINGS_DB_ID }}
          NOTION_SITE_CONFIG_DB_ID: ${{ secrets.NOTION_SITE_CONFIG_DB_ID }}
        run: python sync_events.py sync --production

      - name: Report status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Event sync completed successfully"
          else
            echo "❌ Event sync failed - check logs above"
            exit 1
          fi
