# Manual-only production action. A real push creates Ready events, applies
# Update rows, and executes any Cancel/Delete rows waiting in Notion.
name: Push Events from Notion to Wix

run-name: >-
  ${{ inputs.mode == 'push' && 'Push events to production' || 'Preview production event push' }}
  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview changes or push them to production
        required: true
        default: preview
        type: choice
        options:
          - preview
          - push
      confirmation:
        description: Type PUSH to allow a real push (leave PREVIEW for a preview)
        required: true
        default: PREVIEW
        type: string

# Share the scheduled sync lock. A push must never race a sync's Notion writes.
concurrency:
  group: wix-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Require main and confirm production writes
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production event pushes must run from the main branch."
            exit 1
          fi

          if [[ "$MODE" == "push" && "$CONFIRMATION" != "PUSH" ]]; then
            echo "::error::A real push requires the confirmation value PUSH."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preview or push production events
        env:
          MODE: ${{ inputs.mode }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_ACCOUNT_ID: ${{ secrets.WIX_ACCOUNT_ID }}
          # Keep this on the dev site. --production explicitly retargets the
          # human-dispatched run to WIX_PROD_SITE_ID.
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_PROD_SITE_ID: ${{ secrets.WIX_PROD_SITE_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
          NOTION_EVENT_SCHEDULING_DB_ID: ${{ secrets.NOTION_EVENT_SCHEDULING_DB_ID }}
          NOTION_CATALOG_DB_ID: ${{ secrets.NOTION_CATALOG_DB_ID }}
          # Legacy secret names; remove once the new *_DB_ID secrets are set.
          NOTION_EVENTS_DB_ID: ${{ secrets.NOTION_EVENTS_DB_ID }}
          NOTION_CLASSES_DB_ID: ${{ secrets.NOTION_CLASSES_DB_ID }}
          NOTION_SETTINGS_DB_ID: ${{ secrets.NOTION_SETTINGS_DB_ID }}
          NOTION_SITE_CONFIG_DB_ID: ${{ secrets.NOTION_SITE_CONFIG_DB_ID }}
        run: |
          if [[ "$MODE" == "preview" ]]; then
            python sync_events.py push --dry-run --production
          else
            python sync_events.py push --production
          fi
